<!DOCTYPE html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<h1>New Task</h1> 
<form class="task-form" [formGroup]="taskForm" (ngSubmit)="onSubmit()"> 
<label for="title">Title</label> 
<input id="title" type="text" formControlName="title" placeholder="What needs doing?" /> 

@if (taskForm.controls.title.touched && taskForm.controls.title.invalid) {
    <p class= "error">A title is required (2 characters minimum).</p>
}

<label for="details">Details</label> 
<textarea id="details" rows="3" formControlName="details" placeholder="Any extra info..."></textarea> 

<label for="color">Note color</label> 
<select id="color" formControlName="color"> 
<option value="yellow">Yellow</option> 
<option value="pink">Pink</option> 
<option value="blue">Blue</option> 
<option value="green">Green</option> 
</select> 

<button type="submit" [disabled]="taskForm.invalid">Add Task</button> 
</form>
